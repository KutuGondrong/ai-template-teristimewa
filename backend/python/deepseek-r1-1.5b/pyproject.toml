[project]
name = "ai-chat-deepseek-r1-1-5b"
version = "0.1.0"
description = "Local AI chat backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.10.0",
    "httpx>=0.28.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.17",
]

[project.scripts]
ai-api = "app.main:run"
ai-worker = "worker.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = true
