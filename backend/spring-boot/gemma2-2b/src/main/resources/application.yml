server:
  port: 8000
spring:
  application:
    name: local-ai-ai_gemma2_2b
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/ai_gemma2_2b}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  sql:
    init:
      mode: always
app:
  ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
  ollama-model: ${OLLAMA_MODEL:gemma2:2b}
  cookie-secure: ${COOKIE_SECURE:false}

springdoc:
  swagger-ui:
    path: /docs
    enabled: true
  api-docs:
    enabled: true
